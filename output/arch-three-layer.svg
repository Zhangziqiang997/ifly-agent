<text x="32" y="661" font-size="10" fill="#6b7280">Pipeline后端(标准文档): DocLayout-YOLO布局检测 → PaddleOCR文本提取 → Unimernet公式→LaTeX → PP-StructureV2表格→HTML → 阅读顺序排序 → Markdown/JSON</text>
<text x="740" y="661" font-size="10" fill="#6b7280">| VLM后端: InternVL2 端到端解析</text>
