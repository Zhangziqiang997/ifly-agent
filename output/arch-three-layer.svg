<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif; }
    .mono { font-family: "Courier New", "Consolas", monospace; }
  </style>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#112240" stroke-width="0.5"/>
    </pattern>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#00b4d8"/>
    </marker>
    <marker id="ar-g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#06d6a0"/>
    </marker>
    <marker id="ar-o" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#f77f00"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#0a1628"/>
  <rect width="1200" height="720" fill="url(#grid)" opacity="0.6"/>
  <text x="40" y="46" fill="#ffffff" font-size="22" font-weight="700">参数智能体 · 三层对比分析架构</text>
  <text x="40" y="70" fill="#48cae4" font-size="13">招投标参数智能比对系统 — 由确定到模糊，能算清的绝不交给大模型</text>
  <line x1="40" y1="84" x2="1160" y2="84" stroke="#00b4d8" stroke-width="1" opacity="0.4"/>
  <rect x="40" y="300" width="150" height="120" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="115" y="330" fill="#00b4d8" font-size="11" text-anchor="middle" letter-spacing="0.05em">输 入</text>
  <text x="115" y="358" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="700">招标文件</text>
  <text x="115" y="380" fill="#caf0f8" font-size="11" text-anchor="middle">多条参数要求</text>
  <text x="115" y="400" fill="#48cae4" font-size="10" text-anchor="middle" class="mono">亮度 &#8805; 500cd/m2</text>
  <rect x="250" y="110" width="620" height="560" rx="2" fill="none" stroke="#00b4d8" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="266" y="132" fill="#48cae4" font-size="11" letter-spacing="0.08em">三 层 对 比 引 擎 · 串 行 流 水 线</text>
  <rect x="280" y="150" width="560" height="150" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1.5"/>
  <circle cx="306" cy="180" r="15" fill="#06d6a0" opacity="0.15" stroke="#06d6a0" stroke-width="1"/>
  <text x="306" y="185" fill="#06d6a0" font-size="15" text-anchor="middle" font-weight="700">1</text>
  <text x="332" y="178" fill="#ffffff" font-size="15" font-weight="700">第一层 · 数值比对</text>
  <text x="332" y="198" fill="#48cae4" font-size="11">纯程序计算，不用大模型</text>
  <text x="300" y="228" fill="#caf0f8" font-size="12">· 单位对齐：4K = 3840&#215;2160，13MP = 1300万像素</text>
  <text x="300" y="250" fill="#caf0f8" font-size="12">· 数值大小比较，按招标要求方向判定满足与否</text>
  <text x="300" y="272" fill="#06d6a0" font-size="12" font-weight="700">约 80% 参数在此层直接出结论</text>
  <rect x="280" y="320" width="560" height="150" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1.5"/>
  <circle cx="306" cy="350" r="15" fill="#00b4d8" opacity="0.15" stroke="#00b4d8" stroke-width="1"/>
  <text x="306" y="355" fill="#00b4d8" font-size="15" text-anchor="middle" font-weight="700">2</text>
  <text x="332" y="348" fill="#ffffff" font-size="15" font-weight="700">第二层 · 控标方识别</text>
  <text x="332" y="368" fill="#48cae4" font-size="11">查表统计，不用大模型</text>
  <text x="300" y="398" fill="#caf0f8" font-size="12">· 每条参数比对三家竞品：希沃 / 鸿合 / 海康</text>
  <text x="300" y="420" fill="#caf0f8" font-size="12">· 仅一家满足 = 独有特征，统计各家命中数</text>
  <text x="300" y="442" fill="#00b4d8" font-size="12" font-weight="700">命中最多者 = 控标方 + 置信度</text>
  <rect x="280" y="490" width="560" height="150" rx="2" fill="#0d1f3c" stroke="#f77f00" stroke-width="1.5"/>
  <circle cx="306" cy="520" r="15" fill="#f77f00" opacity="0.15" stroke="#f77f00" stroke-width="1"/>
  <text x="306" y="525" fill="#f77f00" font-size="15" text-anchor="middle" font-weight="700">3</text>
  <text x="332" y="518" fill="#ffffff" font-size="15" font-weight="700">第三层 · 语义精判</text>
  <text x="332" y="538" fill="#48cae4" font-size="11">大模型理解 · DeepSeek</text>
  <text x="300" y="568" fill="#caf0f8" font-size="12">· 说法不同意思相同 → 说辞可改，给改写建议</text>
  <text x="300" y="590" fill="#caf0f8" font-size="12">· 确实不满足 → 生成质疑话术 / 渠道协调建议</text>
  <text x="300" y="612" fill="#f77f00" font-size="12" font-weight="700">只处理前两层无法确定的疑难项</text>
  <rect x="910" y="150" width="250" height="150" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="1035" y="180" fill="#00b4d8" font-size="11" text-anchor="middle" letter-spacing="0.05em">输 出 · 分 析 报 告</text>
  <line x1="926" y1="192" x2="1144" y2="192" stroke="#00b4d8" stroke-width="0.5" opacity="0.5"/>
  <text x="930" y="218" fill="#caf0f8" font-size="12">&#9679; 控标方判定 + 置信度</text>
  <text x="930" y="244" fill="#caf0f8" font-size="12">&#9679; 逐条正 / 负偏离标记</text>
  <text x="930" y="270" fill="#caf0f8" font-size="12">&#9679; 负偏离应对建议</text>
  <rect x="930" y="285" width="14" height="8" rx="1" fill="#06d6a0"/>
  <rect x="1000" y="285" width="14" height="8" rx="1" fill="#f77f00"/>
  <rect x="1075" y="285" width="14" height="8" rx="1" fill="#e63946"/>
  <polyline points="190,360 220,360 220,225 280,225" fill="none" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#ar)"/>
  <polyline points="560,300 560,320" fill="none" stroke="#48cae4" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="570" y="314" fill="#48cae4" font-size="10">数值判定</text>
  <polyline points="560,470 560,490" fill="none" stroke="#48cae4" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="570" y="484" fill="#48cae4" font-size="10">疑难项下沉</text>
  <polyline points="840,225 890,225 890,200 910,200" fill="none" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <polyline points="840,395 890,395 890,235 910,235" fill="none" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#ar)"/>
  <polyline points="840,565 895,565 895,265 910,265" fill="none" stroke="#f77f00" stroke-width="1.5" marker-end="url(#ar-o)"/>
  <rect x="40" y="666" width="14" height="8" rx="1" fill="#06d6a0"/>
  <text x="60" y="674" fill="#caf0f8" font-size="11">正偏离(满足)</text>
  <rect x="160" y="666" width="14" height="8" rx="1" fill="#f77f00"/>
  <text x="180" y="674" fill="#caf0f8" font-size="11">说辞可改</text>
  <rect x="270" y="666" width="14" height="8" rx="1" fill="#e63946"/>
  <text x="290" y="674" fill="#caf0f8" font-size="11">真不满足</text>
  <rect x="920" y="660" width="240" height="44" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <line x1="920" y1="676" x2="1160" y2="676" stroke="#00b4d8" stroke-width="0.5"/>
  <text x="1040" y="672" text-anchor="middle" fill="#48cae4" font-size="9" letter-spacing="0.08em">SYSTEM ARCHITECTURE</text>
  <text x="1040" y="695" text-anchor="middle" fill="#caf0f8" font-size="12" font-weight="700">三层对比分析引擎 v1.0</text>
</svg>