<text x="480" y="612" text-anchor="middle" font-size="10" fill="#0369a1">执行顺序: MinerU解析 → L2(横向查表) → L1(纵向匹配) → L3(AI精判)  |  总计 ~667 行 Python · 14 个函数  |  端到端耗时 ~5s</text>
