<text x="52" y="432" font-size="10" fill="#431407">→ 招标参数 x 3家竞品逐一查表</text>
<text x="52" y="446" font-size="10" fill="#431407">→ 仅1家满足 = 独有特征命中</text>
<text x="52" y="460" font-size="10" fill="#431407">→ 统计 → 控标方 + 置信度</text>
<rect x="335" y="354" width="275" height="126" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
