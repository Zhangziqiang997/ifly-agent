<text x="650" y="432" font-size="10" fill="#4c1d95">→ 全量讯飞目录注入 Prompt</text>
<text x="650" y="446" font-size="10" fill="#4c1d95">→ DeepSeek API (1次请求)</text>
<text x="650" y="460" font-size="10" fill="#4c1d95">→ 失败降级: 读本地缓存 JSON</text>
