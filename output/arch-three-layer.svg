<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
<style>
  text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif; }
</style>
<defs>
  <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
  <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
  <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
  <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
  <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
</defs>
<rect width="960" height="720" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">参数智能体 — 系统架构图</text>
<text x="480" y="54" text-anchor="middle" font-size="12" fill="#6b7280">AI 驱动的招投标参数智能比对与决策辅助系统 | 三层对比架构</text>
<circle cx="48" cy="105" r="10" fill="none" stroke="#6b7280" stroke-width="1.5"/>
<path d="M 33 126 Q 33 116, 48 116 Q 63 116, 63 126" fill="none" stroke="#6b7280" stroke-width="1.5"/>
<text x="48" y="142" text-anchor="middle" font-size="11" fill="#6b7280">用户</text>
<rect x="90" y="72" width="850" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,3"/>
<text x="104" y="90" font-size="11" fill="#94a3b8">Streamlit Web UI (src/app.py)</text>
<rect x="120" y="100" width="395" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="317" y="118" text-anchor="middle" font-size="13" fill="#111827">Page 1: 上传 &amp; 控标结果</text>
<text x="317" y="132" text-anchor="middle" font-size="10" fill="#6b7280">文件上传 · 置信度卡片 · 厂商得分图</text>
<rect x="535" y="100" width="380" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="725" y="118" text-anchor="middle" font-size="13" fill="#111827">Page 2: 参数对比表 &amp; 应对建议</text>
<text x="725" y="132" text-anchor="middle" font-size="10" fill="#6b7280">逐条对比 · 筛选器 · 偏离标记 · 建议卡片</text>
<line x1="65" y1="115" x2="112" y2="115" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a-gray)"/>
<rect x="320" y="180" width="320" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="480" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#1d4ed8">engine.py — run_analysis()</text>
<text x="480" y="220" text-anchor="middle" font-size="11" fill="#6b7280">总调度器: 加载数据 → 调度三层引擎 → 汇总 JSON 输出</text>
<line x1="480" y1="152" x2="480" y2="172" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a-gray)"/>
<rect x="16" y="260" width="928" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="56" y="282" font-size="12" font-weight="600" fill="#64748b">核心分析引擎 (三层对比)</text>
<rect x="36" y="292" width="275" height="160" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="173.5" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#c2410c">Layer 2 · 控标识别</text>
<text x="173.5" y="337" text-anchor="middle" font-size="10" fill="#9a3412">src/matcher.py — 49 行</text>
<line x1="48" y1="346" x2="299" y2="346" stroke="#fed7aa" stroke-width="1"/>
<text x="52" y="362" font-size="11" fill="#431407">identify_controller()</text>
<text x="52" y="378" font-size="11" fill="#431407">→ 招标参数 × 3家竞品逐一查表</text>
<text x="52" y="394" font-size="11" fill="#431407">→ 仅1家满足 = 独有特征命中</text>
<text x="52" y="410" font-size="11" fill="#431407">→ 统计命中数 → 控标方 + 置信度</text>
<rect x="52" y="432" width="243" height="10" rx="3" fill="#fed7aa"/>
<text x="173.5" y="440" text-anchor="middle" font-size="9" fill="#c2410c">纯程序 · 36 次查表 · 不调 AI</text>
<rect x="335" y="292" width="275" height="160" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="472.5" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">Layer 1 · 程序粗筛</text>
<text x="472.5" y="337" text-anchor="middle" font-size="10" fill="#1e3a5f">src/parser.py — 216 行</text>
<line x1="347" y1="346" x2="598" y2="346" stroke="#bfdbfe" stroke-width="1"/>
<text x="351" y="362" font-size="11" fill="#1e3a5f">find_best_match() 评分排序</text>
<text x="351" y="378" font-size="11" fill="#1e3a5f">→ extract_numeric() 数值提取</text>
<text x="351" y="394" font-size="11" fill="#1e3a5f">→ compare_indicators() 指标匹配</text>
<text x="351" y="410" font-size="11" fill="#1e3a5f">→ keyword_overlap() 相似度兜底</text>
<rect x="351" y="432" width="243" height="10" rx="3" fill="#bfdbfe"/>
<text x="472.5" y="440" text-anchor="middle" font-size="9" fill="#1d4ed8">~80% 参数直接出结论 · 不调 AI</text>
<rect x="634" y="292" width="275" height="160" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="771.5" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#6d28d9">Layer 3 · AI 语义精判</text>
<text x="771.5" y="337" text-anchor="middle" font-size="10" fill="#4c1d95">src/advisor.py — 127 行</text>
<line x1="646" y1="346" x2="897" y2="346" stroke="#ddd6fe" stroke-width="1"/>
<text x="650" y="362" font-size="11" fill="#4c1d95">batch_analyze() 批量打包</text>
<text x="650" y="378" font-size="11" fill="#4c1d95">→ 全量讯飞目录注入 Prompt</text>
<text x="650" y="394" font-size="11" fill="#4c1d95">→ DeepSeek API (1次请求)</text>
<text x="650" y="410" font-size="11" fill="#4c1d95">→ 失败降级: 读本地缓存 JSON</text>
<rect x="650" y="432" width="243" height="10" rx="3" fill="#ddd6fe"/>
<text x="771.5" y="440" text-anchor="middle" font-size="9" fill="#6d28d9">仅 uncertain 项 · 单次批量 · API 降级</text>
<path d="M 315 384 L 331 384" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#a-orange)"/>
<text x="323.0" y="378" text-anchor="middle" font-size="9" fill="#ea580c">筛选后</text>
<path d="M 614 384 L 630 384" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
<text x="622.0" y="378" text-anchor="middle" font-size="9" fill="#2563eb">uncertain</text>
<path d="M 480 230 L 480 246 L 472.5 246 L 472.5 284" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
<path d="M 420 230 L 420 246 L 173.5 246 L 173.5 284" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
<path d="M 540 230 L 540 246 L 771.5 246 L 771.5 284" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
<rect x="829" y="300" width="76" height="18" rx="4" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.5"/>
<text x="867" y="313" text-anchor="middle" font-size="9" fill="#7c3aed">→ DeepSeek API</text>
<rect x="16" y="490" width="928" height="78" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="56" y="508" font-size="12" font-weight="600" fill="#64748b">数据层 (src/data_loader.py + config.py / .env)</text>
<rect x="36" y="520" width="210" height="36" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="141.0" y="535" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">competitors/</text>
<text x="141.0" y="549" text-anchor="middle" font-size="9" fill="#6b7280">xiwo · honghe · haikang (各15条)</text>
<rect x="262" y="520" width="210" height="36" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="367.0" y="535" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">xunfei/</text>
<text x="367.0" y="549" text-anchor="middle" font-size="9" fill="#6b7280">xunfei.json (15条)</text>
<rect x="488" y="520" width="210" height="36" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="593.0" y="535" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">samples/</text>
<text x="593.0" y="549" text-anchor="middle" font-size="9" fill="#6b7280">sample-bid.json · demo-result.json</text>
<rect x="714" y="520" width="210" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="819.0" y="535" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">config.py + .env</text>
<text x="819.0" y="549" text-anchor="middle" font-size="9" fill="#6b7280">API_KEY · MODEL · 环境变量</text>
<path d="M 460 230 L 460 250 L 80 250 L 80 486" stroke="#16a34a" stroke-width="1" fill="none" marker-end="url(#a-green)" stroke-dasharray="4,2"/>
<text x="90" y="244" font-size="10" fill="#16a34a">读写 JSON</text>
<path d="M 480 460 L 480 486" stroke="#16a34a" stroke-width="1" fill="none" marker-end="url(#a-green)" stroke-dasharray="4,2"/>
<rect x="16" y="582" width="928" height="26" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
<text x="480" y="599" text-anchor="middle" font-size="11" fill="#0369a1">执行顺序: L2(横向查表) → L1(纵向匹配) → L3(AI精判)  |  总计 ~667 行 Python · 14 个函数  |  端到端耗时 ~5s</text>
<rect x="16" y="622" width="928" height="82" rx="6" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
<text x="32" y="642" font-size="11" font-weight="600" fill="#374151">图例</text>
<line x1="80" y1="658" x2="108" y2="658" stroke="#ea580c" stroke-width="1.5" marker-end="url(#a-orange)"/>
<text x="115" y="656" font-size="11" fill="#374151">控标识别流</text>
<text x="115" y="671" font-size="10" fill="#6b7280">L2: 12条x3家=36次查表</text>
<line x1="250" y1="658" x2="278" y2="658" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
<text x="285" y="656" font-size="11" fill="#374151">程序匹配流</text>
<text x="285" y="671" font-size="10" fill="#6b7280">L1: ~80%参数直接出结论</text>
<line x1="420" y1="658" x2="448" y2="658" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
<text x="455" y="656" font-size="11" fill="#374151">AI 语义流</text>
<text x="455" y="671" font-size="10" fill="#6b7280">L3: 批量打包1次请求 + 降级</text>
<line x1="590" y1="658" x2="618" y2="658" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/>
<text x="625" y="656" font-size="11" fill="#374151">数据读写</text>
<text x="625" y="671" font-size="10" fill="#6b7280">JSON 文件 / 绿色虚线</text>
<line x1="760" y1="658" x2="788" y2="658" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a-gray)"/>
<text x="795" y="656" font-size="11" fill="#374151">用户交互</text>
<text x="795" y="671" font-size="10" fill="#6b7280">Streamlit UI 请求/响应</text>
