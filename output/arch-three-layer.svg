<text x="32" y="794" font-size="9" fill="#6b7280">MinerU 双后端架构 | Pipeline 后端(快): PaddleOCR + DocLayout-YOLO | VLM 后端(强): InternVL2 端到端 | pip install mineru → magic-pdf 命令行 / Python API</text>
