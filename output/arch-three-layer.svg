<text x="472.5" y="396" text-anchor="middle" font-size="9" fill="#1e3a5f">src/parser.py — 216 行</text>
<line x1="347" y1="404" x2="598" y2="404" stroke="#bfdbfe" stroke-width="1"/>
<text x="351" y="418" font-size="10" fill="#1e3a5f">find_best_match() 评分排序</text>
<text x="351" y="432" font-size="10" fill="#1e3a5f">→ extract_numeric() 数值提取</text>
<text x="351" y="446" font-size="10" fill="#1e3a5f">→ compare_indicators() 指标匹配</text>
<text x="351" y="460" font-size="10" fill="#1e3a5f">→ keyword_overlap() 相似度兜底</text>
<rect x="634" y="354" width="275" height="126" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
