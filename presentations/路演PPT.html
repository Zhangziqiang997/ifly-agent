<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育装备招标参数识别与响应决策系统 · 路演</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --brand-blue: #168BEA;
            --brand-sky: #39B7E8;
            --brand-blue-dark: #0B6DB7;
            --navy: #0B315B;
            --ink: #16263A;
            --muted: #6D7C8E;
            --canvas: #F6F9FC;
            --line: #DCE7F1;
            --blue-050: #F2F8FD;
            --blue-100: #DDF1FC;
            --blue-200: #A9DDF6;
            --success: #16B89A;
            --warning: #D97706;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: var(--canvas);
            color: var(--ink);
        }

        /* 16:10 slide = 1920 x 1200 */
        .slide {
            width: 1920px;
            height: 1200px;
            position: relative;
            page-break-after: always;
            overflow: hidden;
            padding: 90px 130px;
            margin: 0 auto 40px;
            background: linear-gradient(135deg, #ffffff 0%, var(--canvas) 100%);
        }

        /* ---------- 公司模板页眉（首页 / 结尾页不使用） ---------- */
        .template-header-page { padding-top: 150px; }
        .template-header-page .page-tag { top: 132px; }
        .template-header {
            position: absolute;
            z-index: 10;
            top: 0;
            left: 0;
            right: 0;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 80px;
            background: linear-gradient(100deg, var(--brand-sky) 0%, var(--brand-blue) 100%);
            box-shadow: 0 2px 16px rgba(11, 79, 138, 0.12);
        }
        .template-header-logo-slot {
            width: 360px;
            height: 60px;
            background: url('ifly_logo.png') center / contain no-repeat;
        }
        .slide-tech.template-header-page .arch-wrap { padding: 22px; }
        .slide-tech.template-header-page .arch-wrap img { max-height: 540px; }
        .slide-tech.template-header-page .arch-principle { margin-top: 22px; }

        /* ===== 演示模式：一次一页 + 键盘翻页 + 自适应缩放 ===== */
        body.present {
            background: #000;
            overflow: hidden;
            height: 100vh;
        }
        body.present #stage {
            position: fixed;
            top: 50%; left: 50%;
            transform-origin: center center;
            /* JS 会覆盖 transform 加入 scale */
        }
        body.present .slide {
            display: none !important;
            margin: 0;
            /* 定位到 stage 中心 */
            position: absolute;
            top: -600px; left: -960px;
        }
        /* 普通页：块级；用 !important 保证覆盖 display:none */
        body.present .slide.active {
            display: block !important;
        }
        /* flex 居中页（封面/演示/结尾）：激活时恢复 flex */
        body.present .slide-cover.active,
        body.present .slide-demo.active,
        body.present .slide-end.active {
            display: flex !important;
        }
        /* 页码指示器（仅演示模式） */
        .pager {
            display: none;
            position: fixed;
            bottom: 26px; right: 40px;
            z-index: 999;
            font-size: 22px; font-weight: 700;
            color: #fff; background: rgba(11,79,138,0.82);
            padding: 8px 20px; border-radius: 20px;
            font-family: 'Inter', sans-serif; letter-spacing: 0.08em;
        }
        body.present .pager { display: block; }

        .page-tag {
            position: absolute;
            top: 54px; right: 70px;
            font-size: 22px; font-weight: 600;
            color: var(--brand-blue-dark); letter-spacing: 0.15em;
            /* 固定外框与锚点，避免不同字数导致切页时左右跳动 */
            width: 320px; height: 52px;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0 24px; border-radius: 26px;
            background: rgba(22,139,234,0.10);
            border: 1.5px solid rgba(22,139,234,0.35);
            white-space: nowrap;
        }
        .doc-badge {
            display: flex; align-items: center; justify-content: center;
            width: fit-content; height: 54px;
            background: linear-gradient(135deg, var(--brand-blue-dark) 0%, var(--brand-blue) 100%);
            color: #fff; font-size: 26px; font-weight: 700; line-height: 1;
            padding: 0 28px; border-radius: 15px;
            letter-spacing: 0.05em; margin-bottom: 28px;
            white-space: nowrap;
        }
        .grad-text {
            background: linear-gradient(135deg, var(--brand-blue-dark) 0%, var(--brand-blue) 72%, var(--success) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ---------- P1 Cover ---------- */
        .slide-cover { display: flex; flex-direction: column; justify-content: space-between; }
        .title-main { font-size: 104px; font-weight: 800; line-height: 1.08; letter-spacing: -0.02em; margin-bottom: 30px; }
        .subtitle { font-size: 40px; font-weight: 300; color: #6b7280; margin-bottom: 70px; }
        .origin-box {
            background: linear-gradient(135deg, var(--brand-blue-dark) 0%, var(--brand-blue) 100%);
            color: #fff; padding: 52px 60px; border-radius: 28px;
            transform: rotate(-1.5deg); box-shadow: 0 24px 70px rgba(22,139,234,0.18);
            max-width: 1180px;
        }
        .origin-label { font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.85; margin-bottom: 18px; }
        .origin-content { font-size: 34px; font-weight: 400; line-height: 1.55; }
        .pain-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px; margin-top: 56px; }
        .pain-card { background: #fff; padding: 40px; border-radius: 22px; box-shadow: 0 12px 44px rgba(0,0,0,0.06); transform: rotate(1.5deg); }
        .pain-card:nth-child(2) { transform: rotate(-1.5deg); }
        .pain-icon { width: 74px; height: 74px; background: linear-gradient(135deg,var(--brand-blue) 0%,var(--brand-sky) 100%); border-radius: 18px; display:flex; align-items:center; justify-content:center; font-size: 40px; margin-bottom: 22px; }
        .pain-card:nth-child(2) .pain-icon { background: linear-gradient(135deg,var(--success) 0%,#6BD8C3 100%); }
        .pain-card:nth-child(3) .pain-icon { background: linear-gradient(135deg,#E28A19 0%,#F6C15A 100%); }
        .pain-title { font-size: 30px; font-weight: 700; color: #111827; margin-bottom: 14px; }
        .pain-desc { font-size: 21px; color: #6b7280; line-height: 1.55; }
        .team-line { position: absolute; bottom: 60px; left: 130px; font-size: 24px; color: #9ca3af; font-weight: 400; }

        /* ---------- P2 Demo ---------- */
        .slide-demo { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(135deg, var(--navy) 0%, #0B4F8A 60%, var(--brand-blue) 100%); }
        .demo-kicker { font-size: 32px; color: var(--blue-100); font-weight: 300; letter-spacing: 0.2em; margin-bottom: 30px; }
        .demo-title { font-size: 132px; font-weight: 800; color: #fff; line-height: 1.05; margin-bottom: 46px; }
        .demo-flow { display: flex; align-items: center; gap: 34px; margin-top: 20px; }
        .demo-step { background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35); color:#fff; padding: 26px 44px; border-radius: 18px; font-size: 30px; font-weight: 600; backdrop-filter: blur(6px); }
        .demo-arrow { font-size: 52px; color: var(--blue-100); }
        .demo-hint { margin-top: 70px; font-size: 26px; color: var(--blue-200); font-weight: 300; }

        /* ---------- shared section header ---------- */
        .sec-head { margin-bottom: 50px; }
        .sec-title { font-size: 66px; font-weight: 800; line-height: 1.1; }
        .sec-sub { font-size: 28px; color: var(--muted); font-weight: 400; margin-top: 14px; }

        /* ---------- P-docs 文档体系 ---------- */
        .doc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 26px 40px; margin-top: 20px; }
        .doc-item { display: flex; align-items: center; gap: 24px; background: #fff; border-radius: 16px; padding: 28px 30px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); border-left: 6px solid var(--brand-blue); }
        .doc-item.first { border-left-color: var(--brand-blue-dark); background: linear-gradient(135deg,#fff 0%,var(--blue-050) 100%); }
        .doc-no { font-size: 46px; font-weight: 800; color: var(--brand-blue); min-width: 64px; line-height: 1; }
        .doc-item.first .doc-no { color: var(--brand-blue-dark); }
        .doc-names { flex: 1; }
        .doc-cn { font-size: 32px; font-weight: 700; color: #111827; line-height: 1.2; }
        .doc-en { font-size: 22px; color: #9ca3af; font-weight: 400; margin-top: 4px; letter-spacing: 0.02em; }
        .doc-flag { font-size: 24px; color: var(--brand-blue-dark); font-weight: 700; white-space: nowrap; }

        /* ---------- P3 团队 + 甘特 ---------- */
        .role-row { display: flex; gap: 26px; margin-bottom: 38px; }
        .role-card { flex: 1; background: #fff; border-radius: 20px; padding: 36px 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); border-top: 6px solid var(--brand-blue); }
        .role-card.pm { border-top-color: var(--brand-blue-dark); }
        .role-card.prod { border-top-color: var(--success); }
        .role-name { font-size: 34px; font-weight: 700; color: #111827; margin-bottom: 12px; }
        .role-who { font-size: 25px; color: var(--brand-blue-dark); font-weight: 700; margin-bottom: 16px; }
        .role-duty { font-size: 23px; color: #6b7280; line-height: 1.5; }
        .gantt { background: #fff; border-radius: 22px; padding: 46px 46px 50px; box-shadow: 0 14px 50px rgba(22,139,234,0.10); }
        .gantt-days { display: grid; grid-template-columns: 220px repeat(3, 1fr); margin-bottom: 20px; }
        .gantt-days div { font-size: 24px; font-weight: 700; color: var(--brand-blue-dark); text-align: center; }
        .gantt-days .lbl { text-align: left; color: #9ca3af; }
        .gantt-row { display: grid; grid-template-columns: 220px repeat(3, 1fr); align-items: center; margin-bottom: 18px; }
        .gantt-label { font-size: 24px; font-weight: 600; color: #374151; }
        .gantt-track { grid-column: 2 / 5; position: relative; height: 54px; }
        .bar { position: absolute; height: 54px; border-radius: 12px; display: flex; align-items: center; padding: 0 20px; font-size: 20px; font-weight: 600; color: #fff; white-space: nowrap; }
        .bar-pm { background: linear-gradient(135deg,var(--brand-blue-dark),var(--brand-blue)); }
        .bar-a  { background: linear-gradient(135deg,var(--success),#4BCDB5); }
        .bar-b  { background: linear-gradient(135deg,var(--brand-sky),#72CBEA); }
        .milestone { position: absolute; top: -2px; right: -6px; font-size: 32px; }
        .gantt-note { margin-top: 28px; font-size: 22px; color: var(--brand-blue-dark); font-weight: 600; text-align: center; }

        /* ---------- PRD 产品需求 ---------- */
        .prd-def { background: linear-gradient(135deg,var(--brand-blue-dark) 0%,var(--brand-blue) 100%); color:#fff; border-radius: 20px; padding: 40px 48px; margin-bottom: 28px; box-shadow: 0 16px 50px rgba(22,139,234,0.18); }
        .prd-def-label { font-size: 22px; font-weight: 700; letter-spacing: 0.1em; opacity: 0.85; margin-bottom: 16px; }
        .prd-def-text { font-size: 36px; font-weight: 600; line-height: 1.5; }
        .prd-def-text .k { color: var(--blue-100); font-weight: 800; }
        .prd-cols { display: flex; gap: 32px; margin-bottom: 16px; }
        .prd-col { flex: 1; }
        .prd-col-h { font-size: 27px; font-weight: 700; color: var(--brand-blue-dark); margin-bottom: 22px; display: flex; align-items: center; gap: 10px; }
        .prd-vs { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .prd-vs-row { display: grid; grid-template-columns: 1.2fr 1fr 1.4fr; align-items: center; padding: 24px 28px; border-bottom: 1px solid var(--line); }
        .prd-vs-row:last-child { border-bottom: none; }
        .prd-vs-row.head { background: var(--blue-050); font-weight: 700; font-size: 18px; color: #8795A5; text-transform: uppercase; letter-spacing: 0.05em; padding: 18px 28px; }
        .prd-dim { font-size: 23px; font-weight: 700; color: #111827; }
        .prd-before { font-size: 21px; color: #9ca3af; }
        .prd-after { font-size: 21px; color: var(--brand-blue-dark); font-weight: 600; }
        .prd-users { background: #fff; border-radius: 18px; padding: 36px 38px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .prd-user-item { margin-bottom: 28px; }
        .prd-user-item:last-child { margin-bottom: 0; }
        .prd-user-role { font-size: 26px; font-weight: 700; color: #111827; margin-bottom: 10px; }
        .prd-user-pain { font-size: 21px; color: #6b7280; line-height: 1.6; }
        .prd-diff-h { font-size: 27px; font-weight: 700; color: var(--brand-blue-dark); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .prd-diff { display: flex; gap: 28px; margin-top: -12px; }
        .prd-diff-card { flex: 1; background: #fff; border-radius: 18px; padding: 24px 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); border-left: 6px solid var(--brand-blue); }
        .prd-diff-card:nth-child(2) { border-left-color: var(--success); }
        .prd-diff-card:nth-child(3) { border-left-color: var(--warning); }
        .prd-diff-title { font-size: 25px; font-weight: 700; color: #111827; margin-bottom: 12px; }
        .prd-diff-title .em { background: linear-gradient(135deg,var(--brand-blue-dark),var(--brand-blue)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .prd-diff-desc { font-size: 20px; color: #6b7280; line-height: 1.6; }

        /* ---------- P4 技术框图 ---------- */
        .arch-diagram { display: flex; align-items: center; gap: 20px; margin-bottom: 42px; }
        .arch-node { background: #fff; border-radius: 20px; padding: 34px 28px; box-shadow: 0 12px 44px rgba(0,0,0,0.06); flex: 0 0 auto; width: 270px; position: relative; border-top: 6px solid var(--brand-blue); }
        .arch-node.arch-input { border-top-color: var(--brand-blue); width: 200px; }
        .arch-node.arch-layer1 { border-top-color: #16B89A; }
        .arch-node.arch-layer2 { border-top-color: var(--brand-blue); }
        .arch-node.arch-layer3 { border-top-color: #D97706; }
        .arch-node.arch-output { border-top-color: var(--brand-blue-dark); width: 200px; }
        .arch-node-badge { display: inline-block; background: var(--blue-050); color: var(--brand-blue-dark); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; padding: 5px 14px; border-radius: 7px; margin-bottom: 14px; text-transform: uppercase; }
        .arch-layer-num { display: inline-block; width: 42px; height: 42px; background: linear-gradient(135deg,var(--brand-blue-dark),var(--brand-blue)); color: #fff; border-radius: 11px; font-size: 23px; font-weight: 800; text-align: center; line-height: 42px; margin-bottom: 14px; }
        .arch-node.arch-layer1 .arch-layer-num { background: linear-gradient(135deg,#0F9D7D,#16B89A); }
        .arch-node.arch-layer3 .arch-layer-num { background: linear-gradient(135deg,#B8630F,#D97706); }
        .arch-node-title { font-size: 26px; font-weight: 800; color: #111827; margin-bottom: 10px; }
        .arch-node-meta { font-size: 15px; color: #6b7280; margin-bottom: 16px; line-height: 1.4; }
        .arch-node-detail { font-size: 16px; color: var(--brand-blue-dark); font-weight: 600; }
        .arch-node-list { margin-top: 14px; }
        .arch-node-list.compact { margin-top: 10px; }
        .arch-item { font-size: 17px; color: #4b5563; line-height: 1.6; margin-bottom: 10px; padding-left: 18px; position: relative; }
        .arch-item::before { content: "•"; position: absolute; left: 0; color: var(--brand-blue); font-weight: 800; }
        .arch-item.highlight { font-weight: 700; color: var(--brand-blue-dark); }
        .arch-item .risk-text { color: #ef4444; font-weight: 800; }
        .arch-arrow { font-size: 36px; color: var(--brand-blue); font-weight: 800; flex: 0 0 auto; }

        .arch-wrap { background: #fff; border-radius: 24px; padding: 30px; box-shadow: 0 16px 55px rgba(22,139,234,0.12); display: flex; justify-content: center; align-items: center; }
        .arch-wrap img { max-width: 100%; max-height: 620px; width: auto; height: auto; border-radius: 12px; }
        .arch-principle { display: flex; gap: 28px; margin-top: 32px; }
        .ap-card { flex: 1; border-radius: 18px; padding: 30px 34px; color: #fff; }
        .ap-1 { background: linear-gradient(135deg,var(--brand-blue-dark),var(--brand-blue)); }
        .ap-2 { background: linear-gradient(135deg,var(--success),#4BCDB5); }
        .ap-label { font-size: 20px; font-weight: 700; opacity: 0.85; margin-bottom: 10px; letter-spacing: 0.05em; }
        .ap-text { font-size: 26px; font-weight: 600; line-height: 1.4; }
        .ap-big { font-size: 46px; font-weight: 800; }

        /* ---------- P5 人机协作 ---------- */
        .motto { text-align: center; font-size: 28px; font-weight: 600; color: var(--brand-blue-dark); margin-bottom: 44px; line-height: 1.5; }
        .motto .b { font-weight: 800; }
        .case-row { display: flex; gap: 32px; margin-bottom: 48px; }
        .case-card { flex: 1; background: #fff; border-radius: 22px; padding: 42px 34px; box-shadow: 0 16px 55px rgba(22,139,234,0.10); }
        .case-cap { font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: var(--brand-blue-dark); text-transform: uppercase; margin-bottom: 18px; }
        .case-head { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
        .case-num { flex: 0 0 auto; width: 64px; height: 64px; background: linear-gradient(135deg,var(--brand-blue-dark),var(--brand-blue)); color:#fff; border-radius: 14px; font-size: 34px; font-weight: 800; text-align:center; line-height: 64px; }
        .case-title { flex: 1; font-size: 32px; font-weight: 700; color: #111827; line-height: 1.25; }
        .case-step { font-size: 25px; line-height: 1.48; margin-bottom: 18px; padding-left: 0; position: relative; color: #4b5563; }
        .case-step:last-child { margin-bottom: 0; }
        .case-step::before { display: none; }
        .case-step .tag { font-weight: 700; color: var(--brand-blue-dark); }
        .case-step.case-fix .tag { color: var(--warning); }
        .case-step code { background: var(--blue-050); color: var(--brand-blue-dark); padding: 2px 8px; border-radius: 6px; font-size: 22px; font-family: 'SFMono-Regular', Consolas, monospace; }

            </div>
            <div class="gantt-row">
                <div class="gantt-label">原型开发</div>
                <div class="gantt-track"><div class="bar bar-b" style="left:33%; width:67%;">3 人并行提取 → 交叉验证 → 辅助</div></div>

        </div>
    </div>

    <!-- ============ P-prd: 专业工作流 · 产品需求 ============ -->
    <div class="slide template-header-page">
        <div class="template-header" aria-hidden="true"><div class="template-header-logo-slot"></div></div>
        <div class="page-tag">02 · 产品需求</div>
        <div class="sec-head" style="margin-bottom: 26px;">
            <div class="doc-badge">02 PRD</div>
            <div class="sec-title">先想清楚：<span class="grad-text">给谁用、解决什么</span></div>
            <div class="sec-sub">在写任何代码之前，先定义产品价值 — 这是 02 号需求文档</div>
        </div>

        <div class="prd-def">
            <div class="prd-def-label">◈ 一句话定义</div>
            <div class="prd-def-text">
                输入招标文件 → <span class="k">识别控标方</span> → 逐条对比讯飞参数 → 标出正负偏离 → <span class="k">生成应对建议</span>

                        <div class="prd-user-role">市场经理</div>
                        <div class="prd-user-pain">拿到标书要逐条对比 100+ 参数，耗时费力，易漏废标项</div>
                    </div>
                    <div class="prd-user-item">
                        <div class="prd-user-role">客户经理</div>

                    </div>

<script>
(function () {
    const slides = Array.from(document.querySelectorAll('.slide'));
    const stage  = document.getElementById('stage');
    const pager  = document.querySelector('.pager');
    const SLIDE_W = 1920, SLIDE_H = 1200;
    let idx = 0;
    let present = false;

    function fitScale() {
        if (!present) return;
        const s = Math.min(window.innerWidth / SLIDE_W, window.innerHeight / SLIDE_H);
        stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
    }

    function show(i) {
        idx = Math.max(0, Math.min(slides.length - 1, i));
        slides.forEach((s, n) => s.classList.toggle('active', n === idx));
        pager.textContent = (idx + 1) + ' / ' + slides.length;
    }

    function enterPresent() {
        present = true;
        document.body.classList.add('present');
        fitScale();
        show(idx);
    }
    function exitPresent() {
        present = false;
        document.body.classList.remove('present');
        stage.style.transform = '';
        slides.forEach(s => s.classList.remove('active'));
    }

    document.addEventListener('keydown', function (e) {
        // O 键：切换 演示 / 滚动总览
        if (e.key === 'o' || e.key === 'O') {
            present ? exitPresent() : enterPresent();
            e.preventDefault();
            return;
        }
        if (!present) return;
        switch (e.key) {
            case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ':
                show(idx + 1); e.preventDefault(); break;
            case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
                show(idx - 1); e.preventDefault(); break;
            case 'Home': show(0); e.preventDefault(); break;
            case 'End':  show(slides.length - 1); e.preventDefault(); break;
            case 'Escape': exitPresent(); e.preventDefault(); break;
        }
    });

    // 点击翻页（演示模式下，左侧上一页 / 右侧下一页）
    document.addEventListener('click', function (e) {
        if (!present) return;
        (e.clientX < window.innerWidth / 2) ? show(idx - 1) : show(idx + 1);
    });

    window.addEventListener('resize', fitScale);

    // 默认进入演示模式
    enterPresent();
})();
</script>
