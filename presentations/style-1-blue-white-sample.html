<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育装备招标参数识别与响应决策系统 - 路演材料</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
            background: #ffffff;
            color: #1e293b;
            line-height: 1.6;
        }

        .page {
            min-height: 100vh;
            padding: 60px;
            page-break-after: always;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 28px;
            font-weight: 400;
            color: #64748b;
            margin-bottom: 60px;
        }

        .origin-box {
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            padding: 24px 30px;
            margin-bottom: 50px;
            font-size: 18px;
            color: #1e293b;
        }

        .pain-points {
            margin-bottom: 80px;
        }

        .pain-points ul {
            list-style: none;
        }

        .pain-points li {
            font-size: 24px;
            margin-bottom: 28px;
            padding-left: 40px;
            position: relative;
        }

        .pain-points li::before {
            content: "•";
            color: #2563eb;
            font-size: 32px;
            position: absolute;
            left: 0;
            top: -4px;
        }

        .team-info {
            position: absolute;
            bottom: 60px;
            left: 60px;
            font-size: 16px;
            color: #94a3b8;
        }

        .page-number {
            position: absolute;
            top: 60px;
            left: 60px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 700;
        }

        .section-title {
            font-size: 32px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 40px;
        }

        .arch-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .arch-container img {
            width: 100%;
            max-width: 900px;
            height: auto;
        }

        .design-principle {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 30px 40px;
            margin-bottom: 40px;
            font-size: 20px;
            color: #334155;
            text-align: center;
        }

        .work-division {
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .division-card {
            background: #2563eb;
            color: #ffffff;
            padding: 20px 40px;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 600;
        }

        @media print {
            .page {
                page-break-after: always;
            }
        }

        @media (max-width: 1200px) {
            .page {
                padding: 40px;
            }
            h1 {
                font-size: 36px;
            }
            .pain-points li {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- P1: 封面 + 痛点页 -->
    <div class="page">
        <div class="page-number">01</div>

        <h1>教育装备招标参数识别与响应决策系统</h1>
        <h2>智能招投标参数分析平台</h2>

        <div class="origin-box">
            课题来自市场部赵书进经理在一线客户对接中的真实痛点
        </div>

        <div class="pain-points">
            <ul>
                <li>人工对比 50+ 条参数耗时 2-3 天</li>
                <li>公示期仅 5 个工作日窗口</li>
                <li>一条 ★ 废标项即致命</li>
            </ul>
        </div>

        <div class="team-info">
            讯飞展翼校招 · 6 人团队 · 3 天完成
        </div>
    </div>

    <!-- P4: 技术框图页 -->
    <div class="page">
        <div class="page-number">04</div>

        <div class="section-title">技术设计 · 三层对比架构</div>

        <div class="arch-container">
            <img src="../../output/arch-three-layer.svg" alt="三层对比架构图">
        </div>

        <div class="design-principle">
            "能用程序算清的，绝不交给大模型——快、省、可解释"
        </div>

        <div class="work-division">
            <div class="division-card">80% 程序秒判</div>
            <div class="division-card">20% AI 精判</div>
        </div>
    </div>
</body>
</html>
